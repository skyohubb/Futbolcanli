name = "futbolcanli"
main = "dist/server.cjs"
compatibility_date = "2024-11-01"
compatibility_flags = ["nodejs_compat"]

# Cloudflare Account - küçük-çimen-c8d8
# Account ID: 03c658bb7282c34d0ee4b67a0357b03e

[assets]
directory = "./dist"
not_found_handling = "single-page-application"

[vars]
FOOTBALL_DATA_API_KEY = "b5eed91d36ea49cba58cd83b4f21f5c8"
NODE_ENV = "production"

# R2 Binding - lütfen Cloudflare Dashboard > R2 > Enable R2
# Ardından bucket oluştur: futbolcanli-data
# [[r2_buckets]]
# binding = "FUTBOLCANLI_DATA"
# bucket_name = "futbolcanli-data"

# KV for daily predictions fallback
# [[kv_namespaces]]
# binding = "DAILY_CACHE"
# id = "c924dcf3-4962-40db-a9ed-05233bf5fbe9"

[observability]
enabled = true

# Cron trigger - günlük tahminleri tazeler (her 30 dakikada bir)
# [triggers]
# crons = ["*/30 * * * *"]

[build]
command = "npm run build"
