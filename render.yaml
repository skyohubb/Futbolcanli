services:
  - type: web
    name: futbolcanli
    env: node
    plan: free
    region: frankfurt
    branch: main
    buildCommand: npm ci --include=dev --legacy-peer-deps && npm run build
    startCommand: node dist/server.cjs
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: FOOTBALL_DATA_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      # Telegram - sadece yonlendirme + opsiyonel broadcast (token yoksa no-op, sistemi bozmaz)
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHANNEL_ID
        sync: false
      - key: TELEGRAM_CHANNEL_URL
        sync: false
      - key: TELEGRAM_ADMIN_ID
        sync: false
