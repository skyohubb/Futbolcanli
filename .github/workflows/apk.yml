name: Build APK (auto)

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install deps
        run: npm ci

      - name: Build web
        run: npm run build

      - name: Sync Capacitor Android
        run: |
          npx cap add android || true
          npx cap sync android
          chmod +x android/gradlew

      - name: Apply custom icon (FutbolCanli CANLI)
        run: |
          node generate-icon.mjs || echo "generate fallback"
          node apply-icon.mjs || echo "apply fallback"
          ls -lh icon-1024.png android/app/src/main/res/mipmap-hdpi/ic_launcher.png

      - name: Build APK (debug)
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: FutbolCanli-debug-${{ github.sha }}
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14

      - name: Upload to GitHub Release (on tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: android/app/build/outputs/apk/debug/app-debug.apk
