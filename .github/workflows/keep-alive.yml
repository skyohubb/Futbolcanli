name: Keep Render Alive
on:
  schedule:
    - cron: '*/14 * * * *'  # her 14dk Render uyumasın (free 50sn gecikme önlenir)
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl -fsS https://futbolcanli.onrender.com/api/health || echo "ping failed"
          curl -fsS https://futbolcanli.onrender.com/api/matches | head -c 200 || true
